<html lang="en">
<head>

  <meta name="theme-color" content="#081b18">
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/styles.css">
  <title>Checkout complete | MeasureStack</title>
  <script>
    window.dataLayer = window.dataLayer || [];
    window.gtag = window.gtag || function () { window.dataLayer.push(arguments); };
    (function () {
      let consent = { analytics: false, marketing: false };
      try { consent = JSON.parse(localStorage.getItem('measurestack_consent_v1')) || consent; } catch (_) {}
      window.gtag('consent', 'default', {
        analytics_storage: consent.analytics ? 'granted' : 'denied',
        ad_storage: consent.marketing ? 'granted' : 'denied',
        ad_user_data: consent.marketing ? 'granted' : 'denied',
        ad_personalization: consent.marketing ? 'granted' : 'denied',
        wait_for_update: 500
      });
    })();
  </script>

</head>

  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5MQ3QDNF" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <header class="site-header"><a class="brand" href="/"><span class="brand-mark">M</span><span>MeasureStack</span></a><nav><a href="/app.html">Workspace</a><a href="/pricing.html">Pricing</a></nav><div class="auth-nav" id="auth-nav"></div></header>
  <main class="success-shell section-shell">
    <section class="checkout-result" id="checkout-result">
      <div class="success-icon"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m4 10 4 4 8-9"></path></svg></div>
      <p class="eyebrow">Reading Stripe test session</p>
      <h1>Resolving your checkout event…</h1>
      <p>The page is verifying the signed-in user, Stripe session, and canonical conversion identifiers.</p>
    </section>
  </main>
  <aside class="consent-banner" id="consent-banner" aria-label="Cookie preferences" hidden><div><strong>Measurement sandbox</strong><p>Choose whether advertising tags may receive the browser copy of this purchase event.</p></div><div class="consent-actions"><button type="button" id="essential-only">Essential only</button><button type="button" class="consent-accept" id="accept-measurement">Accept measurement</button></div></aside>
